<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Página oficial do Despertador Interativo, desenvolvido pelo Mada App Studio." />
    <title>Despertador Interativo — Mada App Studio</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #0d1028; color: #f5f6ff; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(760px, calc(100% - 40px)); padding: 64px 0; }
      .card { padding: clamp(28px, 6vw, 56px); border: 1px solid #ffffff24; border-radius: 28px; background: linear-gradient(145deg, #252d68, #151938); box-shadow: 0 24px 80px #0008; }
      .eyebrow { color: #aeb8ff; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: .78rem; }
      h1 { margin: 14px 0 18px; font-size: clamp(2.3rem, 8vw, 4.8rem); line-height: .98; }
      p { color: #d6d9ef; font-size: 1.08rem; line-height: 1.65; }
      nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
      a { color: white; text-decoration: none; padding: 12px 18px; border-radius: 999px; background: #7166e8; font-weight: 700; }
      a.secondary { background: #ffffff12; border: 1px solid #ffffff24; }
      footer { color: #9ba2c6; margin-top: 24px; font-size: .9rem; }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <div class="eyebrow">Mada App Studio</div>
        <h1>Despertador Interativo</h1>
        <p>Um despertador Android que ajuda você a acordar de verdade com desafios opcionais, funcionamento local e controle das suas preferências.</p>
        <nav aria-label="Links principais">
          <a href="privacy.html">Política de Privacidade</a>
          <a class="secondary" href="mailto:madaappstudio@gmail.com">Suporte</a>
        </nav>
      </section>
      <footer>© 2026 Mada App Studio</footer>
    </main>
  </body>
</html>
